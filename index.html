<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>国試ドリル ― 重要問題 & 禁忌選択肢</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E5%9B%BD%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="wrap">
      <h1>国試ドリル<span class="sub">重要問題 &amp; 禁忌選択肢</span></h1>
      <p class="tagline">医師国家試験の頻出テーマと「選んではいけない選択肢（禁忌）」を鍛える</p>
    </div>
  </header>

  <main class="wrap">
    <!-- ========== スタート画面 ========== -->
    <section id="start-screen" class="screen">
      <div class="card setup-card">
        <h2>出題設定</h2>

        <div class="field">
          <label>科目</label>
          <div id="subject-filters" class="chip-group"></div>
        </div>

        <div class="field">
          <label>重要度</label>
          <div class="chip-group">
            <button class="chip active" data-imp="3">必修級 ★★★</button>
            <button class="chip active" data-imp="2">頻出 ★★</button>
            <button class="chip active" data-imp="1">標準 ★</button>
          </div>
        </div>

        <div class="field">
          <label>モード</label>
          <div class="chip-group mode-group">
            <button class="chip active" data-mode="practice">練習（即時解説）</button>
            <button class="chip" data-mode="exam">模試（最後に採点）</button>
            <button class="chip" data-mode="review">復習（要復習のみ）</button>
          </div>
        </div>

        <div class="field row">
          <label class="inline">
            <input type="checkbox" id="shuffle-toggle" checked /> 問題をシャッフル
          </label>
          <label class="inline">
            出題数
            <select id="count-select">
              <option value="0">すべて</option>
              <option value="5">5問</option>
              <option value="10">10問</option>
              <option value="20">20問</option>
            </select>
          </label>
        </div>

        <p id="pool-info" class="pool-info"></p>
        <button id="start-btn" class="btn primary big">開始する</button>
        <button id="open-editor-btn" class="btn ghost big" style="margin-top:10px">＋ 自分の問題を作成・管理</button>
      </div>

      <div class="card stats-card">
        <h2>これまでの成績</h2>
        <div id="lifetime-stats" class="stat-grid"></div>
        <button id="reset-stats" class="btn ghost small">成績・復習リストをリセット</button>
      </div>
    </section>

    <!-- ========== 出題画面 ========== -->
    <section id="quiz-screen" class="screen hidden">
      <div class="quiz-topbar">
        <div class="progress-wrap">
          <div id="progress-bar" class="progress-bar"><span></span></div>
          <span id="progress-text" class="progress-text"></span>
        </div>
        <div class="live-counters">
          <span class="counter ok" title="正解数">✔ <b id="c-correct">0</b></span>
          <span class="counter ng" title="不正解数">✘ <b id="c-wrong">0</b></span>
          <span class="counter forbid" title="禁忌ヒット数">☠ <b id="c-forbidden">0</b></span>
        </div>
      </div>

      <article class="card question-card">
        <div class="q-meta">
          <span id="q-subject" class="tag"></span>
          <span id="q-importance" class="tag imp"></span>
          <span id="q-type" class="tag ghost"></span>
        </div>
        <p id="q-stem" class="q-stem"></p>
        <ul id="q-choices" class="choices"></ul>

        <div id="feedback" class="feedback hidden"></div>

        <div class="q-actions">
          <button id="submit-btn" class="btn primary">解答する</button>
          <button id="next-btn" class="btn primary hidden">次へ →</button>
          <button id="quit-btn" class="btn ghost small">中断</button>
        </div>
      </article>

      <section id="sketch-card" class="card sketch-card">
        <div class="sketch-head">
          <h3>手書きメモ<span class="sketch-hint">Apple Pencil / タッチ / マウス対応</span></h3>
          <button id="sketch-toggle" class="btn ghost small">メモを隠す</button>
        </div>
        <div id="sketch-body">
          <div class="sketch-tools">
            <div class="tool-group">
              <button class="tool active" data-tool="pen" title="ペン">✏️ ペン</button>
              <button class="tool" data-tool="eraser" title="消しゴム">◭ 消しゴム</button>
            </div>
            <div class="tool-group colors" id="pen-colors"></div>
            <label class="tool-group size-group">太さ
              <input type="range" id="pen-size" min="1" max="14" value="3" />
            </label>
            <div class="tool-group">
              <button id="undo-btn" class="btn ghost small" title="元に戻す">↶ 戻す</button>
              <button id="clear-btn" class="btn ghost small" title="全消し">全消し</button>
            </div>
          </div>
          <div class="canvas-wrap" id="canvas-wrap">
            <canvas id="sketch-canvas"></canvas>
          </div>
        </div>
      </section>
    </section>

    <!-- ========== 結果画面 ========== -->
    <section id="result-screen" class="screen hidden">
      <div class="card result-card">
        <h2>結果</h2>
        <div id="result-summary" class="stat-grid big"></div>
        <div id="forbidden-warning" class="forbidden-banner hidden"></div>
        <h3>問題ごとの結果</h3>
        <ul id="result-list" class="result-list"></ul>
        <div class="q-actions">
          <button id="review-wrong-btn" class="btn primary">要復習だけ解き直す</button>
          <button id="home-btn" class="btn ghost">設定に戻る</button>
        </div>
      </div>
    </section>
    <!-- ========== 問題エディタ画面 ========== -->
    <section id="editor-screen" class="screen hidden">
      <div class="card">
        <div class="editor-head">
          <h2 id="editor-title">問題を作成</h2>
          <button id="editor-home-btn" class="btn ghost small">← 設定に戻る</button>
        </div>

        <form id="q-form" novalidate>
          <input type="hidden" id="f-id" />

          <div class="field row">
            <label class="grow">科目
              <input type="text" id="f-subject" list="subject-list" placeholder="例：循環器" required />
              <datalist id="subject-list"></datalist>
            </label>
            <label class="grow">テーマ
              <input type="text" id="f-topic" placeholder="例：気管支喘息と降圧薬" required />
            </label>
          </div>

          <div class="field row">
            <label>重要度
              <select id="f-importance">
                <option value="3">必修級 ★★★</option>
                <option value="2" selected>頻出 ★★</option>
                <option value="1">標準 ★</option>
              </select>
            </label>
            <label>選択形式
              <select id="f-type">
                <option value="single">1つ選べ（正答は1つ）</option>
                <option value="multiple">複数選べ（正答を複数指定）</option>
              </select>
            </label>
          </div>

          <div class="field">
            <label class="block">問題文
              <textarea id="f-stem" rows="3" placeholder="症例・設問を入力" required></textarea>
            </label>
          </div>

          <div class="field">
            <label class="block">選択肢
              <span class="hint">「正」＝正答 ／ 「禁忌」＝選ぶと不合格級の禁忌肢。少なくとも1つは正答に。</span>
            </label>
            <div id="choices-editor" class="choices-editor"></div>
            <button type="button" id="add-choice-btn" class="btn ghost small">＋ 選択肢を追加</button>
          </div>

          <div class="field">
            <label class="block">解説
              <textarea id="f-explanation" rows="2" placeholder="全体の解説"></textarea>
            </label>
          </div>

          <div class="field">
            <label class="block">ワンポイント（任意）
              <input type="text" id="f-pearl" placeholder="例：【禁忌】喘息 × 非選択的β遮断薬" />
            </label>
          </div>

          <p id="form-error" class="form-error hidden"></p>
          <div class="q-actions">
            <button type="submit" id="save-q-btn" class="btn primary">保存する</button>
            <button type="button" id="cancel-edit-btn" class="btn ghost hidden">編集をやめる</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="editor-head">
          <h2>自作の問題（<span id="custom-count">0</span>）</h2>
          <div class="io-btns">
            <button id="export-btn" class="btn ghost small">JSONで書き出し</button>
            <button id="import-btn" class="btn ghost small">読み込み</button>
            <input type="file" id="import-file" accept="application/json,.json" hidden />
          </div>
        </div>
        <ul id="custom-list" class="custom-list"></ul>
        <p id="custom-empty" class="pool-info">まだ自作の問題はありません。上のフォームから追加できます。</p>
      </div>
    </section>

  </main>

  <footer class="app-footer wrap">
    <p>※ 本アプリの問題は学習用に作成したオリジナル練習問題です。診療・受験対策は必ず最新の成書・ガイドラインで確認してください。</p>
  </footer>

  <script src="data/questions.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
